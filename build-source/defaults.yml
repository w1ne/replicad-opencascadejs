    - symbol: Geom2dGcc_Circ2dTanOnRad
    - symbol: Geom2dGcc_Lin2dTanObl
    - symbol: Geom2dGcc_Lin2d2Tan

    #! Top-level shape repair. Only the sub-fixers (Wire/Solid/Face/Edge) were bound.
    - symbol: ShapeFix_Shape

    #! Curve-on-surface projection. Never linked; consumers guard against its absence.
    - symbol: BRepProj_Projection

    #! STEP import carrying colors/names/assembly tree. The XCAF + XSControl stack is
    #! already bound above for STEPCAFControl_Writer, so this adds one reader class
    #! rather than a dependency tree.
    - symbol: STEPCAFControl_Reader
    - symbol: KernelCAD_XCAF

    #! Mass-property accessors returning primitives only — deliberately NOT binding
    #! gp_Mat or GProp_PrincipalProps, which would pull in types we never otherwise use.
    - symbol: GPropWrapper

