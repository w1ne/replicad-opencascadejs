    class BRepToolsWrapper {
    public:
      static std::string Write(const TopoDS_Shape& shape) {
        std::ostringstream oss(std::ios::binary);
        oss << std::setprecision(17);
        BRepTools::Write(shape, oss);
        return oss.str();
      }
      static TopoDS_Shape Read(const std::string& data) {
        std::istringstream iss(data, std::ios::binary);
        TopoDS_Shape shape;
        BRep_Builder builder;
        Message_ProgressRange progress;
        BRepTools::Read(shape, iss, builder, progress);
        return shape;
      }
    };

    class GPropWrapper {
    public:
      // Row-major element (i,j) of the 3x3 inertia matrix, 1-based per OCCT convention.
      // Exposed element-wise so the binding surface stays primitive-only: gp_Mat is not
      // registered with embind, so returning it directly throws at call time.
      static Standard_Real MatrixOfInertiaValue(const GProp_GProps& props, const Standard_Integer i, const Standard_Integer j) {
        return props.MatrixOfInertia().Value(i, j);
      }
      // Principal moment of inertia, index 0..2. Same primitive-only rationale as above:
      // GProp_PrincipalProps is not bound.
      static Standard_Real PrincipalMoment(const GProp_GProps& props, const Standard_Integer index) {
        Standard_Real i1, i2, i3;
        props.PrincipalProperties().Moments(i1, i2, i3);
        return index == 0 ? i1 : (index == 1 ? i2 : i3);
      }
      // Component (0..2 = X/Y/Z) of principal axis `axis` (0..2).
      static Standard_Real PrincipalAxisComponent(const GProp_GProps& props, const Standard_Integer axis, const Standard_Integer component) {
        GProp_PrincipalProps p = props.PrincipalProperties();
        const gp_Vec v = axis == 0 ? p.FirstAxisOfInertia() : (axis == 1 ? p.SecondAxisOfInertia() : p.ThirdAxisOfInertia());
        return component == 0 ? v.X() : (component == 1 ? v.Y() : v.Z());
      }
      static Standard_Boolean HasSymmetryAxis(const GProp_GProps& props) {
        return props.PrincipalProperties().HasSymmetryAxis();
      }
      static Standard_Boolean HasSymmetryPoint(const GProp_GProps& props) {
        return props.PrincipalProperties().HasSymmetryPoint();
      }
    };

    // Keep generic attribute handles and Standard_GUID private to C++. Exposing
    // TDF_Label::FindAttribute directly would require registering its entire
    // handle/GUID dependency tree, while consumers only need the copied name.
    class KernelCAD_XCAF {
    public:
      static std::string GetName(const TDF_Label& label) {
        Handle(TDF_Attribute) attribute;
        if (!label.FindAttribute(TDataStd_Name::GetID(), attribute)) {
          return std::string();
        }
        const Handle(TDataStd_Name) name = Handle(TDataStd_Name)::DownCast(attribute);
        if (name.IsNull()) return std::string();
        const TCollection_ExtendedString extended = name->Get();
        const Standard_Integer length = extended.LengthOfCString();
        std::string utf8(static_cast<std::string::size_type>(length) + 1, '\0');
        Standard_PCharacter buffer = &utf8[0];
        extended.ToUTF8CString(buffer);
        utf8.resize(static_cast<std::string::size_type>(length));
        return utf8;
      }
      static std::string GetChildTags(const TDF_Label& label) {
        std::ostringstream tags;
        bool first = true;
        for (TDF_ChildIterator iterator(label, Standard_False); iterator.More(); iterator.Next()) {
          if (!first) tags << ',';
          tags << iterator.Value().Tag();
          first = false;
        }
        return tags.str();
      }
    };

    class GeomToolsWrapper {
    public:
      static std::string Write(const Handle(Geom2d_Curve)& geometry) {
        std::ostringstream oss(std::ios::binary);
        oss << std::setprecision(17);
        GeomTools::Write(geometry, oss);
        return oss.str();
      }
      static Handle(Geom2d_Curve) Read(const std::string& data) {
        std::istringstream iss(data, std::ios::binary);
        Handle(Geom2d_Curve) geometry;
        GeomTools::Read(geometry, iss);
        return geometry;
      }
    };
