    #! 2D tangency constructors (Geom2dGcc) — tangent arc/line construction.
    #! gp_Lin2d is REQUIRED, not optional: the Lin2d* constructors return it and an
    #! unbound return type throws BindingError at call time rather than at build time
    #! (this is exactly how gp_Mat silently breaks GProp_GProps::MatrixOfInertia).
    - symbol: gp_Lin2d
    - symbol: GccEnt_Position
    - symbol: Geom2dGcc_QualifiedCurve
    - symbol: Geom2dGcc_Circ2d2TanRad
