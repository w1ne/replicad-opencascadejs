name: Build OCCT WASM bindings

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'build-source/**'
      - 'scripts/fix-destructors.py'
      - 'toolchain/**'
      - '.github/workflows/build-wasm.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The OCCT 8.0.1 toolchain image compiles all of OCCT (~5500 files) when its
    # layer cache is cold; warm runs only generate and link the bindings.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
      - name: Free runner disk (the toolchain image is ~10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install ytt
        run: |
          curl -fsSL https://github.com/carvel-dev/ytt/releases/download/v0.55.4/ytt-linux-amd64 -o "$RUNNER_TEMP/ytt"
          echo '214138d930f5865d561b62f3acba79207afb02c1d87814eb2a2693ea8a33fb9d  '"$RUNNER_TEMP/ytt" | sha256sum --check
          chmod +x "$RUNNER_TEMP/ytt"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@v3
      - name: Build the OCCT 8.0.1 toolchain image
        uses: docker/build-push-action@v6
        with:
          context: toolchain
          load: true
          tags: kernelcad-ocjs-occt8:ci
          cache-from: type=gha,scope=kernelcad-ocjs-occt8
          cache-to: type=gha,mode=max,scope=kernelcad-ocjs-occt8
      - name: Generate OCCT build configuration
        run: |
          ytt -f build-source --output-files build-config
          chmod 644 build-config/*.yml
      - name: Build single and exception-enabled bindings
        working-directory: build-config
        run: |
          cp ../scripts/fix-destructors.py .
          OCCT_IMAGE='kernelcad-ocjs-occt8:ci'
          for cfg in custom_build_single custom_build_with_exceptions; do
            docker run --rm -v "$PWD":/src -w /src \
              -u "$(id -u):$(id -g)" --entrypoint sh "$OCCT_IMAGE" \
              -c "python3 /opencascade.js/src/prepareBindings.py $cfg.yml && python3 /src/fix-destructors.py $cfg.yml && /opencascade.js/src/buildFromYaml.py $cfg.yml"
          done
          mv replicad_single* replicad_with_exceptions* ../src
      - name: Check the modules report OCCT 8.0.1 and load
        run: node scripts/check-wasm.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: replicad-opencascadejs-wasm
          path: |
            src/replicad_single.js
            src/replicad_single.wasm
            src/replicad_single.d.ts
            src/replicad_with_exceptions.js
            src/replicad_with_exceptions.wasm
            src/replicad_with_exceptions.d.ts
          if-no-files-found: error
